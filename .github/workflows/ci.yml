name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package (with dev deps)
        run: pip install -e ".[dev]"
      - name: Run tests (offline, reproduces the reference result)
        run: pytest -q --cov=isoform_dominance --cov-fail-under=90
      - name: Self-test through the installed console script
        run: isoform-dominance selftest

  floor:
    name: tests at the declared dependency floors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      # The matrix above installs the newest release of everything, so it can never
      # notice a floor in pyproject.toml that is too low -- which is how `scipy>=1.10`
      # stood while SciPy < 1.15 returned an anti-conservative Wilcoxon p. Here every
      # runtime dependency is pinned to exactly its declared minimum, read out of
      # pyproject.toml so that the floor and this job cannot drift apart.
      - name: pin runtime dependencies to their floors
        run: |
          python - > floors.txt <<'PY'
          import re
          text = open("pyproject.toml").read()
          deps = re.search(r"^dependencies = \[(.*?)\]", text, re.S | re.M).group(1)
          for name, version in re.findall(r'"([A-Za-z0-9_.-]+)>=([0-9.]+)"', deps):
              print("%s==%s" % (name, version))
          PY
          cat floors.txt
      - run: pip install -c floors.txt -e ".[dev]"
      - run: python -c "import numpy, scipy, matplotlib; print(numpy.__version__, scipy.__version__, matplotlib.__version__)"
      - run: pytest -q
      - run: isoform-dominance selftest

  wheel:
    name: install from a built wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # catches packaging faults the editable install hides: a module left out of
      # the wheel, or a console script that does not survive a real install
      - run: python -m pip install --upgrade build
      - run: python -m build
      - run: pip install dist/*.whl
      - run: isoform-dominance --version && isoform-dominance selftest
        working-directory: ${{ runner.temp }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src tests scripts

  docs-example:
    name: committed example matches the code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python scripts/make_docs_example.py
      # The stats table is the hard gate: it is plain text with no font or renderer
      # dependence, so a difference here means the committed example no longer matches
      # what the code produces. This is exactly how it went a minor version stale.
      - name: stats table must be current
        run: git diff --exit-code -- docs/example_output_stats.csv
      # The SVG and PDF are byte-reproducible for a given Matplotlib; the PNG is not,
      # across platforms, because glyph rasterisation goes through FreeType and its
      # hinting differs by build and CPU architecture. So a figure difference is
      # reported for a human to look at rather than failing the build on someone's
      # machine or on an unrelated Matplotlib release.
      - name: report any figure difference
        if: always()
        run: git diff --stat -- docs/example_output.png docs/example_output.pdf docs/example_output.svg

  attribution:
    name: no AI assistant credited in the history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Commits here are authored and committed by a person. A co-author trailer, a session
      # line or an assistant identity would put the assistant on GitHub's contributor list,
      # so any of them anywhere in the history fails the build.
      - name: refuse AI attribution in the commit history
        run: |
          pat='^(co-authored-by:.*(claude|anthropic)|claude-session:)|generated with \[?claude|noreply@anthropic\.com'
          bad=0
          for c in $(git rev-list HEAD); do
            if git log -1 --format='%an <%ae>%n%cn <%ce>' "$c" | grep -Eiq 'claude|anthropic' \
               || git log -1 --format=%B "$c" | grep -Eiq "$pat"; then
              echo "::error::$(git log -1 --format='%h %an <%ae> | %s' "$c") credits an AI assistant"
              bad=1
            fi
          done
          echo "checked $(git rev-list --count HEAD) commits"
          exit $bad
