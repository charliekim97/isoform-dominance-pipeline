name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package (with dev deps)
        run: pip install -e ".[dev]"
      - name: Run tests (offline, reproduces the reference result)
        run: pytest -q --cov=isoform_dominance --cov-fail-under=90
      - name: Self-test through the installed console script
        run: isoform-dominance selftest

  wheel:
    name: install from a built wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # catches packaging faults the editable install hides: a module left out of
      # the wheel, or a console script that does not survive a real install
      - run: python -m pip install --upgrade build
      - run: python -m build
      - run: pip install dist/*.whl
      - run: isoform-dominance --version && isoform-dominance selftest
        working-directory: ${{ runner.temp }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src tests
